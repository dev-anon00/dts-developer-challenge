# Local PostgreSQL for the backend. Start with `docker compose up -d`.
# Credentials match the defaults in backend/src/main/resources/application.yaml.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
